  - obligation_id: HR-e-invoicing-b2g-issue-all
    jurisdiction: HR
    jurisdiction_name: Croatia
    regime: e-invoicing-b2g
    regime_label: HR public procurement — eRačun in javnoj nabavi
    direction: issue
    counterparty_scope: b2g
    bound_party: >-
      Suppliers and service providers issuing invoices in public procurement procedures to Croatian
      contracting authorities and contracting entities.
    threshold_type: none
    threshold_value: null
    threshold_currency: null
    threshold_operator: null
    threshold_basis: null
    threshold_period: null
    threshold_definition: >-
      No size test identified. Croatia went further than Directive 2014/55/EU requires: the
      directive obliges only the contracting authority to RECEIVE, whereas Croatia also obliges
      the supplier to ISSUE electronically, which is why this is recorded as a direction=issue row
      rather than only a receiving duty.
    format_name: EN 16931 (European standard on electronic invoicing)
    format_version: EN 16931-1:2017
    format_note: >-
      Format recorded from the standard that Directive 2014/55/EU requires and that čl. 2(9) of
      the 2025 Zakon o fiskalizaciji also adopts; the 2018 public-procurement act's own format
      provision and any Croatian CIUS version for B2G were not read. Note čl. 33(1) of the 2025
      Act: the rules on issuing eRačune in public procurement apply mutatis mutandis to the B2B
      eRačun regime, so the two regimes are deliberately aligned.
    mandatory_from: '2019-07-01'
    tolerance_ends: null
    tolerance_note: null
    legal_instrument: >-
      Zakon o elektroničkom izdavanju računa u javnoj nabavi ("Narodne novine" br. 94/2018),
      transposing Directive 2014/55/EU. The gazette text was not read.
    source_url: https://mingo.gov.hr/vijesti/objavljen-zakon-o-elektronickom-izdavanju-racuna-u-javnoj-nabavi/6406
    source_title: >-
      Ministarstvo gospodarstva (Croatian Ministry of Economy), "Objavljen Zakon o elektroničkom
      izdavanju računa u javnoj nabavi"
    source_type: secondary
    secondary_source_urls:
      - https://www.teb.hr/novosti/2018/zakon-o-elektronickom-izdavanju-racuna-u-javnoj-nabavi-nar-nov-br-9418/
      - https://www.iusinfo.hr/aktualno/u-sredistu/51276
    checked_on: '2026-10-07'
    confidence: reported
    confidence_note: >-
      The Act's existence, its gazette reference (NN 94/2018), its entry into force on 2018-11-01
      and the two operative dates (authorities receive from 2018-12-01, suppliers issue from
      2019-07-01) are consistent across the Ministry of Economy's own announcement and Croatian
      practitioner sources read on 2026-10-07. The gazette text itself was not retrieved, so this
      is graded reported. Primary source supremacy: it becomes verified when NN 94/2018 is read,
      not because several sources agree.
    unknowns:
      - >-
        The gazette text of NN 94/2018 has not been read. The 2019-07-01 issuing date and the
        2018-12-01 receiving date rest on the Ministry's announcement and secondary coverage, not
        on the statute.
      - >-
        Article numbers for the issuing duty and the format provision are not recorded.
      - >-
        Whether the 2025 Zakon o fiskalizaciji amended or displaced any part of the 2018 act was
        not checked; čl. 33(1) cross-refers to it rather than repealing it, and čl. 79 repeals
        only the old cash-fiscalisation act.
    notes: >-
      Croatia has had a working national e-invoicing channel since 2019, which is why the 2026 B2B
      mandate is a smaller step there than the same date would be elsewhere.

