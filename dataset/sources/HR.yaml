    format_name: Sustav za fiskalizaciju eRačuna data set (čl. 48, čl. 51–53)
    format_version: null
    format_note: >-
      As with the issuing side, the Act prescribes data rather than a versioned published format;
      the čl. 32 pravilnik carries the technical detail and has not been read.
    mandatory_from: '2026-01-01'
    tolerance_ends: null
    tolerance_note: null
    legal_instrument: >-
      Zakon o fiskalizaciji ("Narodne novine" br. 89/2025), čl. 47, čl. 48, čl. 51–53;
      commencement under čl. 80.
    source_url: https://narodne-novine.nn.hr/eli/sluzbeni/2025/89/1233/pdf
    source_title: >-
      Zakon o fiskalizaciji, Narodne novine br. 89, 13 June 2025, act no. 1233 (official gazette
      PDF)
    source_type: official_gazette
    secondary_source_urls: []
    checked_on: '2026-10-07'
    confidence: verified
    confidence_note: >-
      Čl. 47 read verbatim on 2026-10-07 and names the primatelj eRačuna alongside the izdavatelj
      as an obligor for every received eRačun. Čl. 80 places čl. 47–57 at 2026-01-01.
    unknowns:
      - >-
        Transmission deadline for recipient-side fiscalisation not established — same gap as the
        issuing row.
      - >-
        Whether rejection reporting under čl. 51–53 carries its own separate deadline was not
        established.
    notes: >-
      A buyer-side reporting duty is rare and expensive to implement, which makes it worth its own
      row rather than a footnote. A Croatian business that only receives invoices still has a
